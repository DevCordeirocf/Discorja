<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https: wss: ws://127.0.0.1:* ws://localhost:* http://127.0.0.1:* http://localhost:*; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="theme-color" content="#101115" />
    <!-- Keep the shared foundation first; app.css contains product-level overrides. -->
    <link rel="stylesheet" href="/styles/style.css" />
    <link rel="stylesheet" href="/styles/app.css" />
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <title>Discorja</title>
  </head>
  <body>
    <div id="startup-splash" aria-hidden="true">
      <div class="startup-logo">
        <img
          src="./assets/logo.png"
          alt=""
          width="1024"
          height="1024"
          draggable="false"
        />
        <span class="startup-eye-glow startup-eye-glow-left"></span>
        <span class="startup-eye-glow startup-eye-glow-right"></span>
      </div>
    </div>
    <div id="window-chrome" aria-label="Controles da janela">
      <div class="window-drag-region" aria-hidden="true"></div>
      <div
        class="window-controls"
        role="group"
        aria-label="Controles da janela"
      >
        <button
          type="button"
          data-window-control="minimize"
          aria-label="Minimizar"
          title="Minimizar"
        >
          −
        </button>
        <button
          type="button"
          data-window-control="maximize"
          aria-label="Maximizar ou restaurar"
          title="Maximizar ou restaurar"
        >
          □
        </button>
        <button
          type="button"
          data-window-control="close"
          aria-label="Fechar"
          title="Fechar"
        >
          ×
        </button>
      </div>
    </div>
    <div id="app" inert></div>
    <script type="module" src="/app.ts"></script>
  </body>
</html>
