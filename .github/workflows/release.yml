name: Release Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente, correspondente à versão do package.json (ex.: v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DISCORJA_PUBLISHER_NAME: ${{ vars.DISCORJA_PUBLISHER_NAME }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Validate optional signing configuration
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: node scripts/validate-release.mjs
      - name: Validate tag version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -cne "v$packageVersion") {
            throw 'Tag version must match package.json.'
          }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'The requested tag does not exist.' }
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Build Windows installer
        run: npm run dist:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer signatures and updater artifacts
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -LiteralPath release -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'No Windows installer was generated.' }
          foreach ($installer in $installers) {
            if ('${{ steps.signing.outputs.signed }}' -eq 'true') {
              $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
              if ($signature.Status -ne 'Valid') {
                throw "Invalid Authenticode signature: $($installer.Name)"
              }
              node -e "const {parseDn}=require('builder-util-runtime');const [expected,actual]=process.argv.slice(1);const name=parseDn(expected),subject=parseDn(actual);const matches=name.size?[...name].every(([key,value])=>subject.get(key)===value):subject.get('CN')===expected;if(!matches)process.exitCode=1" $env:DISCORJA_PUBLISHER_NAME $signature.SignerCertificate.Subject
              if ($LASTEXITCODE -ne 0) {
                throw "Installer publisher does not match update configuration: $($installer.Name)"
              }
            }
            if (-not (Test-Path -LiteralPath "$($installer.FullName).blockmap")) {
              throw "Missing blockmap: $($installer.Name)"
            }
          }
          if (-not (Test-Path -LiteralPath release/latest.yml)) {
            throw 'Missing latest.yml update manifest.'
          }
      - name: Upload draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null | Set-Variable existingDraft
          if ($LASTEXITCODE -eq 0) {
            if ($existingDraft -ne 'true') { throw 'Refusing to change an already published release.' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft --title "Discorja $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create draft release.' }
          }
          $artifacts = @(Get-ChildItem -LiteralPath release -File | Where-Object {
            $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml'
          } | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @artifacts --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release artifacts.' }
